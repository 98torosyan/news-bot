      - name: Clean up - remove misplaced files and the old unused bot code
        run: |
          # files that were uploaded to the repo root by mistake
          git rm -q -f --ignore-unmatch scripts/generate_highlight_covers.py scripts/publish_to_instagram.py __init__.py builder.py gemini.py lessons.json news.py palettes.py \
            render.py run.py state.json state.py engine.js fonts.css styles.css install.yml reels.yml
          # old daily pipeline, replaced by reels/ (delivery/, config.py, scripts/ are still used)
          git rm -r -q -f --ignore-unmatch content data video visuals tests sample-output main.py
          rm -rf docs/media
          printf 'requests>=2.31\npynacl>=1.5\n' > requirements.txt
          cat > README.md <<'README'
          # TradeInvest - Instagram Reels bot

          Automatic Armenian crypto Reels for @armtradeinvest.

          - `reels/` - the whole system: lessons, news (Gemini), design, music, rendering
          - `reels/lessons.json` - lesson bank
          - `reels/assets/music/news`, `reels/assets/music/lesson` - background music
          - `delivery/` - Instagram and Telegram publishing
          - `.github/workflows/reels.yml` - schedule (5 lessons + 3 news per day)
          - `.github/workflows/refresh-token.yml` - keeps the Instagram token alive
          README
          sed -i 's/^          //' README.md

      - name: Fetch Armenian fonts
        run: |
          mkdir -p reels/assets/fonts /tmp/f && cd /tmp/f
          npm pack --silent @fontsource/noto-sans-armenian@5.3.0 @fontsource/noto-serif-armenian@5.3.0
          for t in *.tgz; do mkdir -p "${t%.tgz}" && tar -xzf "$t" -C "${t%.tgz}"; done
          cd "$GITHUB_WORKSPACE"
          for w in 400 500 600 700 800; do for s in armenian latin; do
            cp /tmp/f/fontsource-noto-sans-armenian-*/package/files/noto-sans-armenian-$s-$w-normal.woff2 reels/assets/fonts/; done; done
          for w in 400 700 800; do for s in armenian latin; do
            cp /tmp/f/fontsource-noto-serif-armenian-*/package/files/noto-serif-armenian-$s-$w-normal.woff2 reels/assets/fonts/; done; done
          ls reels/assets/fonts | wc -l

      - name: Put music in place
        run: |
          mkdir -p reels/assets/music/news reels/assets/music/lesson
          place() {  # $1 = mixkit id, $2 = name, $3 = news|lesson
            dst="reels/assets/music/$3/$2.mp3"
            [ -s "$dst" ] && return 0
            src=$(find . -maxdepth 1 \( -name "mixkit-*-$1.mp3" -o -name "$2.mp3" -o -name "${4:-none}.mp3" \) | head -1)
            if [ -n "$src" ]; then git mv -f "$src" "$dst" 2>/dev/null || mv -f "$src" "$dst"; return 0; fi
            for u in "https://assets.mixkit.co/music/$1/$1.mp3" "https://assets.mixkit.co/music/preview/mixkit-$2-$1.mp3"; do
              if curl -fsSL -A "Mozilla/5.0" -o "$dst" "$u" && [ "$(stat -c%s "$dst")" -gt 100000 ]; then echo "downloaded $2"; return 0; fi
            done
            rm -f "$dst"; echo "::warning::music $2 not found - upload mixkit-...-$1.mp3 to the repo root and run this installer again"
          }
          place 770 autofahren news
          place 755 workout news
          place 738 hip-hop-02 news hiphop
          place 1024 delayed-flight lesson
          place 877 memories lesson
          place 400 cbpd lesson
          # the copies uploaded to the repo root are no longer needed
          git rm -q -f --ignore-unmatch autofahren.mp3 cbpd.mp3 delayed-flight.mp3 hiphop.mp3 memories.mp3 workout.mp3 mixkit-*.mp3
          ls -la reels/assets/music/*

      - name: Save to the repository
        run: |
          git config user.name "tradeinvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .
          git commit -q -m "Install TradeInvest Reels" || echo "nothing to commit"
          git push

      - name: Turn off the old daily bot and start a first test reel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable daily-content.yml || echo "old workflow already disabled"
          gh workflow run reels.yml -f kind=story
          gh workflow run reels.yml -f kind=lesson
          echo "Test story + lesson started - check the 'TradeInvest Reels' workflow."
